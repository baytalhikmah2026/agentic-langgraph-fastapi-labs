[project]
name = "sovereign-brain"
version = "0.1.0"
description = "The AI Research Desk of Crescent Ledger Bank: agents with LangGraph behind FastAPI"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]==0.162.4",
    "langchain==1.4.10",
    "langchain-core==1.7.7",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.7.4",
    "langgraph==1.2.20",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
]

[project.scripts]
sovereign-brain = "sovereign_brain:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

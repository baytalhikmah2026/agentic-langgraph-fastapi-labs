[project]
name = "sovereign-brain"
version = "0.1.0"
description = "The AI Research Desk of Crescent Ledger Bank: agents with LangGraph behind FastAPI"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]==0.162.4",
    "langchain==1.4.10",
    "langchain-core==1.7.7",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.7.4",
    "langgraph==1.2.20",
    "psycopg[binary,pool]==3.3.8",
    "pwdlib[argon2]==0.3.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "pyjwt==2.15.1",
    "redis==8.1.0",
    "slowapi==0.1.10",
    "sqlalchemy[asyncio]==2.1.8",
]

[project.scripts]
sovereign-brain = "sovereign_brain:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "aiosqlite==0.22.1",
    "httpx==0.28.1",
    "locust==2.47.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
]

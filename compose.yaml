name: sovereign-brain

services:
  api:
    build: .
    image: sovereign-brain-api:dev
    container_name: sb-api
    command: ["fastapi", "dev", "src/sovereign_brain/main.py", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      SB_OLLAMA_BASE_URL: http://ollama:11434
      SB_DATABASE_URL: postgresql+psycopg://sb:sb_local_pw@postgres:5432/sovereign_brain
      SB_REDIS_URL: redis://redis:6379/0
      SB_RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
      SB_CHECKPOINT_STORE: postgres
      SB_SHARED_STATE_STORE: redis
      SB_QDRANT_URL: http://qdrant:6333
      SB_MARKET_API_URL: https://market:8100
      SB_MARKET_CA_FILE: /certs/ca.crt
      SB_MARKET_CLIENT_CERT: /certs/api-client.crt
      SB_MARKET_CLIENT_KEY: /certs/api-client.key
      SB_SANDBOX_URL: http://sandbox:8200
      SB_OTEL_ENABLED: "true"
      SB_OTEL_ENDPOINT: http://otel-collector:4318
      SB_VAULT_ADDR: http://vault:8200  # the API's secrets come from Vault (Lab 75)
    depends_on:
      vault:
        condition: service_healthy
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      market:
        condition: service_healthy
      sandbox:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - default
      - sandbox-net
    volumes:
      - ./ops/certs:/certs:ro  # mutual TLS to the market API (Lab 74)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock

  market:
    # The internal market-data API (Lab 46): same image as the API, its own small app
    build: .
    image: sovereign-brain-api:dev
    container_name: sb-market
    # Lab 74: HTTPS with mutual TLS; callers need a certificate signed by our CA
    command:
      - uvicorn
      - sovereign_brain.market.app:app
      - --host=0.0.0.0
      - --port=8100
      - --ssl-certfile=/certs/market.crt
      - --ssl-keyfile=/certs/market.key
      - --ssl-ca-certs=/certs/ca.crt
      - --ssl-cert-reqs=2
    ports:
      - "8100:8100"
    env_file:
      - path: .env
        required: false
    environment:
      SB_VAULT_ADDR: http://vault:8200  # the market token comes from Vault (Lab 75)
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - ./ops/certs:/certs:ro
    healthcheck:
      test: ["CMD", "python", "-m", "sovereign_brain.market.health"]
      interval: 10s
      timeout: 3s
      retries: 5

  sandbox:
    # The code sandbox (Lab 47): locked down, reachable only from the API, no internet
    build: .
    image: sovereign-brain-api:dev
    container_name: sb-sandbox
    command: ["fastapi", "run", "src/sovereign_brain/sandbox/runner.py", "--host", "0.0.0.0", "--port", "8200"]
    networks:
      - sandbox-net
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:0.40.16
    container_name: sb-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:18.6
    container_name: sb-postgres
    environment:
      POSTGRES_USER: sb
      POSTGRES_PASSWORD: sb_local_pw
      POSTGRES_DB: sovereign_brain
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sb -d sovereign_brain"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.3
    container_name: sb-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: sb-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # the image has no curl: bash opens a TCP connection to the REST port instead
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  vault:
    # Secrets (Lab 75): Vault in development mode, open http://localhost:8200
    image: hashicorp/vault:2.2.1
    container_name: sb-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: $SB_VAULT_ROOT_TOKEN
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    # Tracing (Lab 66): receives the API's spans and passes them on to Jaeger
    image: otel/opentelemetry-collector-contrib:0.165.0
    container_name: sb-otel-collector
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ./ops/otel/collector.yaml:/etc/otelcol/collector.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    # Trace viewer (Lab 66): open http://localhost:16686
    image: jaegertracing/jaeger:2.23.0
    container_name: sb-jaeger
    ports:
      - "16686:16686"

  prometheus:
    # Metrics (Lab 68): reads the API's /metrics page; open http://localhost:9090
    image: prom/prometheus:v3.16.0
    container_name: sb-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api

  grafana:
    # Dashboards and alerts (Lab 69): open http://localhost:3000 and sign in as admin
    image: grafana/grafana:13.3.1
    container_name: sb-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: $SB_GRAFANA_ADMIN_PASSWORD
      SB_ALERT_WEBHOOK_TOKEN: $SB_ALERT_WEBHOOK_TOKEN
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  vllm:
    # Optional, NVIDIA GPU only: docker compose --profile gpu up -d vllm
    image: vllm/vllm-openai:v0.33.0
    container_name: sb-vllm
    profiles: ["gpu"]
    command: ["--model", "Qwen/Qwen3-4B", "--max-model-len", "8192"]
    ports:
      - "8001:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  sandbox-net:
    internal: true  # no route to the internet or the other services (Lab 47)

volumes:
  ollama-models:
  pg-data:
  redis-data:
  qdrant-data:
  hf-cache:
  prometheus-data:
  grafana-data:

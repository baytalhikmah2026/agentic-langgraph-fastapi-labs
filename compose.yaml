name: sovereign-brain

services:
  api:
    build: .
    image: sovereign-brain-api:dev
    container_name: sb-api
    command: ["fastapi", "dev", "src/sovereign_brain/main.py", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      SB_OLLAMA_BASE_URL: http://ollama:11434
      SB_DATABASE_URL: postgresql+psycopg://sb:sb_local_pw@postgres:5432/sovereign_brain
      SB_REDIS_URL: redis://redis:6379/0
      SB_RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
      SB_CHECKPOINT_STORE: postgres
      SB_QDRANT_URL: http://qdrant:6333
      SB_MARKET_API_URL: http://market:8100
      SB_SANDBOX_URL: http://sandbox:8200
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      market:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    networks:
      - default
      - sandbox-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock

  market:
    # The internal market-data API (Lab 46): same image as the API, its own small app
    build: .
    image: sovereign-brain-api:dev
    container_name: sb-market
    command: ["fastapi", "run", "src/sovereign_brain/market/app.py", "--host", "0.0.0.0", "--port", "8100"]
    ports:
      - "8100:8100"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  sandbox:
    # The code sandbox (Lab 47): locked down, reachable only from the API, no internet
    build: .
    image: sovereign-brain-api:dev
    container_name: sb-sandbox
    command: ["fastapi", "run", "src/sovereign_brain/sandbox/runner.py", "--host", "0.0.0.0", "--port", "8200"]
    networks:
      - sandbox-net
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:0.40.16
    container_name: sb-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:18.6
    container_name: sb-postgres
    environment:
      POSTGRES_USER: sb
      POSTGRES_PASSWORD: sb_local_pw
      POSTGRES_DB: sovereign_brain
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sb -d sovereign_brain"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.3
    container_name: sb-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: sb-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # the image has no curl: bash opens a TCP connection to the REST port instead
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  vllm:
    # Optional, NVIDIA GPU only: docker compose --profile gpu up -d vllm
    image: vllm/vllm-openai:v0.33.0
    container_name: sb-vllm
    profiles: ["gpu"]
    command: ["--model", "Qwen/Qwen3-4B", "--max-model-len", "8192"]
    ports:
      - "8001:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  sandbox-net:
    internal: true  # no route to the internet or the other services (Lab 47)

volumes:
  ollama-models:
  pg-data:
  redis-data:
  qdrant-data:
  hf-cache:

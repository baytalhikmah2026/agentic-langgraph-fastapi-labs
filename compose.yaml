name: sovereign-brain

services:
  api:
    build: .
    image: sovereign-brain-api:dev
    container_name: sb-api
    command: ["fastapi", "dev", "src/sovereign_brain/main.py", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      SB_OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock

  ollama:
    image: ollama/ollama:0.40.16
    container_name: sb-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  vllm:
    # Optional, NVIDIA GPU only: docker compose --profile gpu up -d vllm
    image: vllm/vllm-openai:v0.33.0
    container_name: sb-vllm
    profiles: ["gpu"]
    command: ["--model", "Qwen/Qwen3-4B", "--max-model-len", "8192"]
    ports:
      - "8001:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama-models:
  hf-cache:

name: sovereign-brain

services:
  api:
    build: .
    image: sovereign-brain-api:dev
    container_name: sb-api
    command: ["fastapi", "dev", "src/sovereign_brain/main.py", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      SB_OLLAMA_BASE_URL: http://ollama:11434
      SB_DATABASE_URL: postgresql+psycopg://sb:sb_local_pw@postgres:5432/sovereign_brain
      SB_REDIS_URL: redis://redis:6379/0
      SB_RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
      SB_CHECKPOINT_STORE: postgres
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock

  ollama:
    image: ollama/ollama:0.40.16
    container_name: sb-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:18.6
    container_name: sb-postgres
    environment:
      POSTGRES_USER: sb
      POSTGRES_PASSWORD: sb_local_pw
      POSTGRES_DB: sovereign_brain
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sb -d sovereign_brain"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.3
    container_name: sb-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  vllm:
    # Optional, NVIDIA GPU only: docker compose --profile gpu up -d vllm
    image: vllm/vllm-openai:v0.33.0
    container_name: sb-vllm
    profiles: ["gpu"]
    command: ["--model", "Qwen/Qwen3-4B", "--max-model-len", "8192"]
    ports:
      - "8001:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama-models:
  pg-data:
  redis-data:
  hf-cache:

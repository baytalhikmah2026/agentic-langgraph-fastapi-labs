# The Research Desk API (Lab 82): two copies of our own image behind one Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: sovereign-brain-api:0.1.0
          ports:
            - name: http
              containerPort: 8000
          env:  # Lab 84 moves these into a ConfigMap and a Secret
            - name: SB_ENVIRONMENT
              value: production
            - name: SB_LLM_MODEL
              value: qwen3:4b
            - name: SB_OLLAMA_BASE_URL
              value: http://ollama:11434
            - name: SB_DATABASE_URL
              value: postgresql+psycopg://sb:sb_local_pw@postgres:5432/sovereign_brain
            - name: SB_REDIS_URL
              value: redis://redis:6379/0
            - name: SB_RATE_LIMIT_STORAGE_URI
              value: redis://redis:6379/1
            - name: SB_CHECKPOINT_STORE
              value: postgres
            - name: SB_SHARED_STATE_STORE
              value: redis
            - name: SB_QDRANT_URL
              value: http://qdrant:6333
            - name: SB_MCP_SERVERS
              value: '["desk", "notes"]'  # the market server joins in Lab 84
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http

# The Research Desk API (Lab 82): two copies of our own image behind one Service
# Lab 84: everyday settings from the ConfigMap, secrets as files, market certificates as files
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  strategy:
    rollingUpdate:  # Lab 86: never fewer ready copies than wanted during an update
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001  # mounted secret files belong to our group, so we can read them
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: sovereign-brain-api:0.1.0
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: desk-config
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets/desk
              readOnly: true
            - name: market-certs
              mountPath: /certs
              readOnly: true
          startupProbe:  # Lab 86: the first start loads spaCy, the MCP servers and the graphs
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 36  # up to 3 minutes
          livenessProbe:  # a stuck process gets restarted
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:  # no database or Redis: no traffic for this pod until they're back
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:  # leave the Service first, then stop: no request is cut off
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: secrets
          secret:
            secretName: desk-secrets
            defaultMode: 0440
        - name: market-certs
          secret:
            secretName: market-tls
            defaultMode: 0440
            items:  # only the client side: the CA, our certificate and its key
              - key: ca.crt
                path: ca.crt
              - key: api-client.crt
                path: api-client.crt
              - key: api-client.key
                path: api-client.key
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http

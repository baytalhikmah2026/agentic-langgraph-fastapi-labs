# The desk's standard berth plan (Lab 82): every object, in one namespace
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sovereign-brain
labels:
  - pairs:
      app.kubernetes.io/part-of: sovereign-brain
resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - qdrant.yaml
  - ollama.yaml
  - api.yaml
  - seed-job.yaml

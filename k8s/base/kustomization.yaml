# The desk's standard berth plan (Lab 82): every object, in one namespace
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sovereign-brain
labels:
  - pairs:
      app.kubernetes.io/part-of: sovereign-brain
resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - qdrant.yaml
  - ollama.yaml
  - market.yaml
  - api.yaml
  - seed-job.yaml
  - research-worker.yaml
  - autoscaling.yaml
  - ingress.yaml
# Lab 84: the everyday settings, shared by the API and the workers. The name gets a hash of the
# content (desk-config-<hash>), so changing a value rolls the pods that use it automatically.
configMapGenerator:
  - name: desk-config
    envs:
      - desk-config.env

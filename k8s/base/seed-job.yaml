# Loads clients and positions into PostgreSQL (Lab 82): runs once, retries until the database is up
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-db
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600  # the finished Job removes itself after 10 minutes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed-db
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: seed
          image: sovereign-brain-api:0.1.0
          command: ["python", "scripts/seed_db.py"]
          env:
            - name: SB_DATABASE_URL
              value: postgresql+psycopg://sb:sb_local_pw@postgres:5432/sovereign_brain
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

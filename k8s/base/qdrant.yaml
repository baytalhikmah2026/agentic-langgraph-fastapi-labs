# Qdrant (Lab 85): a StatefulSet with its own disk; the semantic memory
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
spec:
  serviceName: qdrant  # the headless Service below gives the pod a stable name: qdrant-0.qdrant
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain  # deleting the StatefulSet keeps the disk, and the bank's data on it
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
    spec:
      nodeSelector:
        crescent-ledger.bank/residency: on-premises  # the bank's data stays on its own nodes
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.20.0
          ports:
            - name: http
              containerPort: 6333
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          readinessProbe:  # Lab 86: Qdrant's own health pages
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:  # one disk per pod, created once and reused after every restart
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
spec:
  clusterIP: None  # headless: the name points straight at the pod
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http

# Research workers (Lab 83): take queued jobs from Redis; KEDA decides how many run (0 to 4)
# Lab 84: the same ConfigMap, secrets and certificates as the API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-worker
spec:
  # no "replicas" here: KEDA owns the number, and re-applying the plan must not reset it
  selector:
    matchLabels:
      app.kubernetes.io/name: research-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: research-worker
    spec:
      terminationGracePeriodSeconds: 300  # time to finish the current job before stopping
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: sovereign-brain-api:0.2.0
          command: ["python", "-m", "sovereign_brain.workers.research_worker"]
          envFrom:
            - configMapRef:
                name: desk-config
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets/desk
              readOnly: true
            - name: market-certs
              mountPath: /certs
              readOnly: true
          livenessProbe:  # Lab 86: the heartbeat file must be fresh (see workers/heartbeat.py)
            exec:
              command: ["python", "-m", "sovereign_brain.workers.heartbeat"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: secrets
          secret:
            secretName: desk-secrets
            defaultMode: 0440
        - name: market-certs
          secret:
            secretName: market-tls
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
              - key: api-client.crt
                path: api-client.crt
              - key: api-client.key
                path: api-client.key

# The internal market-data API (Lab 84 in the cluster; built in Labs 46 and 74):
# HTTPS with mutual TLS, its token as a file, nothing else from the desk's secrets
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: market
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: market
          image: sovereign-brain-api:0.1.0
          command:
            - uvicorn
            - sovereign_brain.market.app:app
            - --host=0.0.0.0
            - --port=8100
            - --ssl-certfile=/certs/market.crt
            - --ssl-keyfile=/certs/market.key
            - --ssl-ca-certs=/certs/ca.crt
            - --ssl-cert-reqs=2
          env:
            - name: SB_ENVIRONMENT
              value: production
            - name: SB_SECRETS_DIR
              value: /run/secrets/market
          ports:
            - name: https
              containerPort: 8100
          volumeMounts:
            - name: token
              mountPath: /run/secrets/market
              readOnly: true
            - name: certs
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: token
          secret:
            secretName: desk-secrets
            defaultMode: 0440
            items:  # only the market token
              - key: SB_MARKET_API_TOKEN
                path: SB_MARKET_API_TOKEN
        - name: certs
          secret:
            secretName: market-tls
            defaultMode: 0440
            items:  # only the server side: the CA, the market's certificate and its key
              - key: ca.crt
                path: ca.crt
              - key: market.crt
                path: market.crt
              - key: market.key
                path: market.key
---
apiVersion: v1
kind: Service
metadata:
  name: market
spec:
  selector:
    app.kubernetes.io/name: market
  ports:
    - name: https
      port: 8100
      targetPort: https

# PostgreSQL (Lab 85): a StatefulSet with its own disk; the desk's records and checkpoints live here
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres  # the headless Service below gives the pod a stable name: postgres-0.postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain  # deleting the StatefulSet keeps the disk, and the bank's data on it
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      nodeSelector:
        crescent-ledger.bank/residency: on-premises  # the bank's data stays on its own nodes
      containers:
        - name: postgres
          image: postgres:18.6
          env:
            - name: POSTGRES_USER
              value: sb
            - name: POSTGRES_PASSWORD
              valueFrom:  # Lab 84: from the Secret made by scripts/k8s_secrets.py
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: sovereign_brain
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:  # Lab 86: the same check Compose uses
            exec:
              command: ["pg_isready", "-U", "sb", "-d", "sovereign_brain"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "sb", "-d", "sovereign_brain"]
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:  # one disk per pod, created once and reused after every restart
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None  # headless: the name points straight at the pod
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
